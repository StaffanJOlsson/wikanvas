name: Feature request
description: Suggest something Wikanvas should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How you would like it to work. Sketches and examples from other tools help.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered, or workarounds you use now.
