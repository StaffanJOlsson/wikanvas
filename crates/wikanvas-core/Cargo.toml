[package]
name = "wikanvas-core"
description = "Wikanvas's pure domain logic: ids, rank, tree rules, cursors, Y text, conversion and the board codec (no I/O)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
wikanvas-api.workspace = true
inkboard-core.workspace = true
yrs.workspace = true
comrak.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v7"] }
sha2.workspace = true
base64.workspace = true
thiserror.workspace = true
getrandom.workspace = true
# NFKD for ids::slugify (the web slug rule); MIT OR Apache-2.0, already in Cargo.lock through comrak (caseless).
unicode-normalization = "0.1.25"

[dev-dependencies]
proptest.workspace = true
